[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-hail-risk"
version = "0.0.6"
description = "Home Assistant custom integration skeleton for radar-based hail-risk estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.1",
  "pytest-asyncio>=0.23",
  "pytest-homeassistant-custom-component>=0.13.317,<0.14; python_full_version >= '3.14.2'",
  "ruff>=0.5,<0.6",
  "mypy>=1.10,<1.16",
  "Pillow>=10"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["custom_components", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true

[tool.black]
line-length = 100
