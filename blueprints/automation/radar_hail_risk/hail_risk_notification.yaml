blueprint:
  name: Radar Hail Risk notification
  description: >
    Sends a mobile/app notification when Radar Hail Risk reaches watch, warning,
    or urgent. The blueprint is opt-in and does not modify dashboards or helpers.
  domain: automation
  source_url: https://github.com/petrvnk/radar-hail-risk/blob/main/blueprints/automation/radar_hail_risk/hail_risk_notification.yaml
  input:
    risk_level_sensor:
      name: Risk level sensor
      description: >
        Sensor entity that exposes the risk level: none, watch, warning, urgent,
        or unavailable.
      selector:
        entity:
          domain: sensor
    risk_summary_sensor:
      name: Risk summary sensor
      description: Optional summary sensor used in the notification body.
      default: ""
      selector:
        entity:
          domain: sensor
    notify_service:
      name: Notify service
      description: "Example: notify.mobile_app_phone or notify.persistent_notification."
      selector:
        text:
    minimum_level:
      name: Minimum level to notify
      description: Choose when the automation starts notifying.
      default: warning
      selector:
        select:
          options:
            - watch
            - warning
            - urgent
    title_language:
      name: Title language
      description: Notification title language.
      default: en
      selector:
        select:
          options:
            - en
            - cs
    cooldown_minutes:
      name: Cooldown minutes
      description: Minimum time between repeated notifications from this automation.
      default: 30
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: min
          mode: slider

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input risk_level_sensor

variables:
  risk_level_entity: !input risk_level_sensor
  summary_entity: !input risk_summary_sensor
  minimum_level: !input minimum_level
  title_language: !input title_language
  cooldown_minutes: !input cooldown_minutes
  current_level: "{{ states(risk_level_entity) }}"
  evidence_kind: "{{ state_attr(risk_level_entity, 'evidence_kind') or 'unknown' }}"
  summary_text: >-
    {% if summary_entity %}
      {{ states(summary_entity) }}
    {% else %}
      {{ state_attr(risk_level_entity, 'summary') or current_level }}
    {% endif %}
  message_text: >-
    {% if title_language == 'cs' %}
      {% if evidence_kind == 'lightning_only' %}Blízká bouřka / blesky poblíž; kroupy nejsou potvrzené{% elif evidence_kind == 'radar_hail' and current_level == 'urgent' %}Radar ukazuje vysoké riziko krup poblíž{% elif evidence_kind == 'radar_hail' and current_level == 'warning' %}Radar ukazuje možné kroupy poblíž{% elif evidence_kind == 'radar_hail_with_lightning' and current_level == 'urgent' %}Radar ukazuje vysoké riziko krup poblíž; blesky jsou také poblíž{% elif evidence_kind == 'radar_hail_with_lightning' and current_level == 'warning' %}Radar ukazuje možné kroupy poblíž; blesky jsou také poblíž{% elif evidence_kind == 'radar_storm' %}Sledování bouřky{% else %}Změna stavu počasí; radarové potvrzení není k dispozici{% endif %}
    {% else %}
      {% if evidence_kind == 'lightning_only' %}Thunderstorm / lightning nearby; hail not confirmed{% elif evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}{{ summary_text }}{% elif evidence_kind == 'radar_storm' %}Storm watch{% else %}Weather risk state changed; radar confirmation unavailable{% endif %}
    {% endif %}
  level_rank: >-
    {{ {'none': 0, 'unavailable': 0, 'watch': 1, 'warning': 2, 'urgent': 3}.get(current_level, 0) }}
  min_rank: >-
    {{ {'watch': 1, 'warning': 2, 'urgent': 3}.get(minimum_level, 2) }}
  title_text: >-
    {% if title_language == 'cs' %}
      {% if evidence_kind == 'lightning_only' %}Blízká bouřka / blesky poblíž{% elif current_level == 'urgent' and evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}Vysoké riziko krup{% elif current_level == 'warning' and evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}Možné kroupy poblíž{% elif current_level == 'watch' and evidence_kind == 'radar_storm' %}Sledování bouřky{% else %}Upozornění na počasí{% endif %}
    {% else %}
      {% if evidence_kind == 'lightning_only' %}Thunderstorm / lightning nearby{% elif current_level == 'urgent' and evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}High hail risk nearby{% elif current_level == 'warning' and evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}Possible hail nearby{% elif current_level == 'watch' and evidence_kind == 'radar_storm' %}Storm watch{% else %}Weather risk update{% endif %}
    {% endif %}
  notification_icon: >-
    {% if evidence_kind == 'lightning_only' %}mdi:weather-lightning{% elif evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}mdi:weather-hail{% else %}mdi:weather-cloudy-alert{% endif %}

action:
  - condition: template
    value_template: "{{ level_rank | int >= min_rank | int }}"
  - condition: template
    value_template: >-
      {% set last = this.attributes.last_triggered %}
      {{ last is none or cooldown_minutes | int(0) == 0 or (now() - last).total_seconds() >= cooldown_minutes | int * 60 }}
  - service: !input notify_service
    data:
      title: "{{ title_text }}"
      message: "{{ message_text }}"
      data:
        tag: radar_hail_risk
        group: weather
        notification_icon: "{{ notification_icon }}"
