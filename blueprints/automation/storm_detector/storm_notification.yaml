blueprint:
  name: Storm Detector notification
  description: >
    Sends an evidence-aware mobile/app notification when Storm Detector reaches
    watch, warning, or urgent. This opt-in blueprint does not modify dashboards
    or helpers and is not an official warning source.
  domain: automation
  source_url: https://github.com/petrvnk/storm-detector/blob/main/blueprints/automation/storm_detector/storm_notification.yaml
  input:
    level_entity:
      name: Storm Detector level entity
      description: >
        Entity that exposes the Storm Detector level: none, watch, warning, urgent,
        or unavailable.
      default: sensor.storm_detector_level
      selector:
        entity:
          domain: sensor
    summary_entity:
      name: Storm Detector summary entity
      description: Optional summary sensor used in the notification body.
      default: sensor.storm_detector_summary
      selector:
        entity:
          domain: sensor
    notify_service:
      name: Notify service
      description: "Example: notify.mobile_app_phone or notify.persistent_notification."
      selector:
        text:
    minimum_level:
      name: Minimum level to notify
      description: Choose when the automation starts notifying.
      default: warning
      selector:
        select:
          options:
            - watch
            - warning
            - urgent
    title_language:
      name: Title language
      description: Notification title language.
      default: en
      selector:
        select:
          options:
            - en
            - cs
    cooldown_minutes:
      name: Cooldown minutes
      description: Minimum time between repeated notifications from this automation.
      default: 30
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: min
          mode: slider

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input level_entity

variables:
  level_entity_id: !input level_entity
  summary_entity_id: !input summary_entity
  minimum_level: !input minimum_level
  title_language: !input title_language
  cooldown_minutes: !input cooldown_minutes
  current_level: "{{ states(level_entity_id) }}"
  evidence_kind: "{{ state_attr(level_entity_id, 'evidence_kind') or 'unknown' }}"
  summary_text: >-
    {% if summary_entity_id %}
      {{ states(summary_entity_id) }}
    {% else %}
      {{ state_attr(level_entity_id, 'summary') or current_level }}
    {% endif %}
  message_text: >-
    {% if title_language == 'cs' %}
      {% if evidence_kind == 'lightning_only' %}Bouřka / blesky poblíž; kroupy nejsou radarově potvrzené. Sledujte oficiální výstrahy.{% elif evidence_kind == 'radar_hail' and current_level == 'urgent' %}Radar ukazuje vysokou možnost krup poblíž. Sledujte oficiální výstrahy.{% elif evidence_kind == 'radar_hail' %}Radar ukazuje možné kroupy poblíž. Sledujte oficiální výstrahy.{% elif evidence_kind == 'radar_hail_with_lightning' and current_level == 'urgent' %}Radar ukazuje vysokou možnost krup poblíž; blesky jsou také poblíž. Sledujte oficiální výstrahy.{% elif evidence_kind == 'radar_hail_with_lightning' %}Radar ukazuje možné kroupy poblíž; blesky jsou také poblíž. Sledujte oficiální výstrahy.{% elif evidence_kind == 'radar_storm' %}Bouřka v okolí. Sledujte oficiální výstrahy.{% else %}Změna stavu počasí; aktuální podklady jsou omezené. Sledujte oficiální výstrahy.{% endif %}
    {% else %}
      {% if evidence_kind == 'lightning_only' %}Storm / lightning nearby; hail is not radar-confirmed. Follow official weather warnings.{% elif evidence_kind == 'radar_hail' and current_level == 'urgent' %}Radar indicates a high possibility of hail nearby. Follow official weather warnings.{% elif evidence_kind == 'radar_hail' %}Radar indicates possible hail nearby. Follow official weather warnings.{% elif evidence_kind == 'radar_hail_with_lightning' and current_level == 'urgent' %}Radar indicates a high possibility of hail nearby; lightning is also nearby. Follow official weather warnings.{% elif evidence_kind == 'radar_hail_with_lightning' %}Radar indicates possible hail nearby; lightning is also nearby. Follow official weather warnings.{% elif evidence_kind == 'radar_storm' %}Storm detected nearby. Follow official weather warnings.{% else %}Weather state changed; current evidence is limited. Follow official weather warnings.{% endif %}
    {% endif %}
  level_rank: >-
    {{ {'none': 0, 'unavailable': 0, 'watch': 1, 'warning': 2, 'urgent': 3}.get(current_level, 0) }}
  min_rank: >-
    {{ {'watch': 1, 'warning': 2, 'urgent': 3}.get(minimum_level, 2) }}
  title_text: >-
    {% if title_language == 'cs' %}
      {% if evidence_kind == 'lightning_only' %}Bouřka / blesky poblíž{% elif current_level == 'urgent' and evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}Vysoká možnost krup poblíž{% elif evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}Možné kroupy poblíž{% elif evidence_kind == 'radar_storm' %}Sledování bouřky{% else %}Upozornění na počasí{% endif %}
    {% else %}
      {% if evidence_kind == 'lightning_only' %}Storm / lightning nearby{% elif current_level == 'urgent' and evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}High possibility of hail nearby{% elif evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}Possible hail nearby{% elif evidence_kind == 'radar_storm' %}Storm watch{% else %}Weather update{% endif %}
    {% endif %}
  notification_icon: >-
    {% if evidence_kind == 'lightning_only' %}mdi:weather-lightning{% elif evidence_kind in ['radar_hail', 'radar_hail_with_lightning'] %}mdi:weather-hail{% else %}mdi:weather-cloudy-alert{% endif %}

action:
  - condition: template
    value_template: "{{ level_rank | int >= min_rank | int }}"
  - condition: template
    value_template: >-
      {% set last = this.attributes.last_triggered %}
      {{ last is none or cooldown_minutes | int(0) == 0 or (now() - last).total_seconds() >= cooldown_minutes | int * 60 }}
  - service: !input notify_service
    data:
      title: "{{ title_text }}"
      message: "{{ message_text }}"
      data:
        tag: storm_detector
        group: weather
        notification_icon: "{{ notification_icon }}"
