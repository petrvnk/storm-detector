name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
      - name: Compile Python files
        run: python -m compileall -q .

  home-assistant:
    name: Home Assistant (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum 2024.10.0
            python-version: "3.12"
            lock-file: requirements-ha-min.lock
            home-assistant-version: "2024.10.0"
          - name: current stable
            python-version: "3.14.2"
            lock-file: requirements-ha-current.lock
            home-assistant-version: "2026.8.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real Home Assistant test stack
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r "${{ matrix.lock-file }}"
      - name: Verify Home Assistant test stack
        env:
          EXPECTED_HOME_ASSISTANT_VERSION: ${{ matrix.home-assistant-version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          import homeassistant
          import pytest_homeassistant_custom_component

          actual = version("homeassistant")
          expected = os.environ["EXPECTED_HOME_ASSISTANT_VERSION"]
          if actual != expected:
              raise SystemExit(f"Expected Home Assistant {expected}, resolved {actual}")
          PY
          python -m pip show homeassistant pytest-homeassistant-custom-component
      - name: Run tests against Home Assistant
        run: python -m pytest -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
