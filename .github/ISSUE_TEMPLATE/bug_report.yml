name: Bug report
description: Report a problem with Radar Hail Risk
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include secrets, exact home address, or private tokens.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2024.10.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Radar Hail Risk version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant entity states/attributes, logs, and whether RainViewer/Blitzortung data was stale.
      render: text
