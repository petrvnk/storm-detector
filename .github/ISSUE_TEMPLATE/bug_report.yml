name: Bug report
description: Report a problem with Storm Detector
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include secrets, exact home address, or private tokens.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2024.10.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Storm Detector version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Generated diagnostics omit identifying config and location details. Still review attachments and remove private entity names, addresses, and log details before posting.
      render: text
