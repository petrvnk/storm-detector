# Mushroom card example for Storm Detector.
# Requires Mushroom cards. Adjust entity IDs if you renamed the integration.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    primary: Storm Detector
    secondary: "{{ states('sensor.storm_detector_summary') }}"
    icon: mdi:weather-hail
    icon_color: >-
      {% set level = states('sensor.storm_detector_level') %}
      {% if level == 'urgent' %}red
      {% elif level == 'warning' %}orange
      {% elif level == 'watch' %}yellow
      {% elif level == 'unavailable' %}grey
      {% else %}green
      {% endif %}
    tap_action:
      action: more-info
      entity: sensor.storm_detector_level
  - type: custom:mushroom-chips-card
    chips:
      - type: entity
        entity: sensor.storm_detector_max_dbz
        icon: mdi:radar
      - type: entity
        entity: sensor.storm_detector_lightning_distance
        icon: mdi:flash
      - type: entity
        entity: binary_sensor.storm_detector_data_stale
        icon: mdi:clock-alert-outline
